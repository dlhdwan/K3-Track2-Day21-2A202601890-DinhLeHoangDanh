name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chay unit tests tren du lieu ao (khong can GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huan luyen mo hinh tren du lieu thuc, upload artifact len cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          SA_KEY: ${{ secrets.CLOUD_CREDENTIALS || secrets.GCP_SA_KEY }}
        run: |
          echo "$SA_KEY" > sa-key.json
          echo "$SA_KEY" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          BUCKET_NAME: ${{ secrets.CLOUD_BUCKET || 'mlops-lab-day21-2a202601890-bucket' }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ.get("BUCKET_NAME")
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print("Model uploaded to GCS successfully.")
          EOF

      # BONUS 3: Save metrics & report as artifacts
      - name: Save metrics and report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-and-report
          path: |
            outputs/metrics.json
            outputs/report.txt

  # JOB 3: Kiem tra chat luong - Eval Gate & BONUS 4 Rollback Safety Check
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Authenticate to Cloud Storage
        env:
          SA_KEY: ${{ secrets.CLOUD_CREDENTIALS || secrets.GCP_SA_KEY }}
        run: |
          echo "$SA_KEY" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Check eval gate and Bonus 4 Model Rollback Protection
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          BUCKET_NAME: ${{ secrets.CLOUD_BUCKET || 'mlops-lab-day21-2a202601890-bucket' }}
        run: |
          python - <<'EOF'
          import os, sys, json
          from google.cloud import storage

          acc = float(os.environ.get("ACCURACY", 0.0))
          print(f"Eval Gate New Model Accuracy: {acc}")

          # 1. Absolute Eval Gate Check (>= 0.70)
          if acc < 0.70:
              print(f"FAILED: Accuracy {acc:.4f} < 0.70 threshold. Deployment blocked!")
              sys.exit(1)

          # 2. BONUS 4: Rollback Safety Check against previous version
          bucket_name = os.environ.get("BUCKET_NAME")
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob_metrics = bucket.blob("metrics/latest.json")

          old_acc = 0.0
          if blob_metrics.exists():
              try:
                  content = json.loads(blob_metrics.download_as_text())
                  old_acc = float(content.get("accuracy", 0.0))
                  print(f"Bonus 4 Check: Previous Model Accuracy on GCS = {old_acc:.4f}")
              except Exception as e:
                  print(f"Could not parse previous metrics: {e}")

          if acc < old_acc:
              print(f"BONUS 4 ROLLBACK TRIGGERED: New accuracy ({acc:.4f}) is lower than previous accuracy ({old_acc:.4f})! Deployment canceled!")
              sys.exit(1)

          print(f"PASSED: New accuracy ({acc:.4f}) >= previous ({old_acc:.4f}) & threshold (0.70). Updating metrics on GCS...")
          blob_metrics.upload_from_string(json.dumps({"accuracy": acc}), content_type="application/json")
          EOF

  # JOB 4: Trien khai sau khi eval gate & rollback check qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || secrets.VM_IP }}
          username: ${{ secrets.VM_USER || 'GIGABYTE' }}
          key: ${{ secrets.VM_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -f http://127.0.0.1:8000/health || exit 1
